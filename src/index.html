<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="./main.js" defer></script>
  </head>

  <body>
    <section id="drop-zone">
      <div class="loader"></div>
      <img src="./assets/front.svg" alt="Drag and Drop Files here." class="-visible" />
      <section class="floater -visible">
        <fieldset>
          <label for="resize-width">Resize Ascii Width (px):</label>
          <input name="resize-width" id="resize-width" placeholder="300px" type="number" min="0" max="4294967295" step="1" />
        </fieldset>
        <fieldset>
          <label for="resize-height">Resize Ascii Height (px):</label>
          <input name="resize-height" id="resize-height" placeholder="600px" type="number" min="0" max="4294967295" step="1" />
        </fieldset>
      </section>
    </section>
  </body>
</html>
